<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/login.css" />
</head>
<body class="login-page">
    <main class="main-wrapper">
        <section class="login-card reveal-up">
            <h2>Accedi</h2>
            <p class="subtitle">Entra nel tuo spazio Job Tracker</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Inserisci username"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Inserisci password"
                        required
                    />
                </div>

                <button type="submit" class="btn-submit">Accedi</button>
                <p class="error-message" id="loginError">Credenziali non valide.</p>
            </form>

            <div class="guest-divider"><span>oppure</span></div>
            <button type="button" class="btn-guest" id="guestBtn">Entra come ospite</button>
            <p class="guest-note">Esplora il progetto senza account</p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="./js/api.js"></script>
    <script type="module" src="./js/login.js"></script>
</body>
</html>

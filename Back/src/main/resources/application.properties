spring.application.name=job-tracker-spring

# Credenziali locali facoltative (file escluso da git tramite .gitignore).
# Vedi application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

# Connessione al database
# In produzione (Render) i valori arrivano dalle variabili d'ambiente
# DB_URL, DB_USER e DB_PASSWORD. In locale si usano i valori dopo i due punti
# oppure quelli in application-local.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobapplicationtracker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Configurazione Hibernate (Spring lo fa per noi)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Chiave per firmare i token di login (variabile d'ambiente AUTH_SECRET su Render)
auth.secret=${AUTH_SECRET:}

# Render assegna la porta tramite la variabile PORT
server.port=${PORT:8080}
